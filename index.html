<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat Volume Tracker</title>

    css/styles.css

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/pjsscript>
    <script src="https://net/npm/chart.jsscript>
</head>

<body>

    <header>
        <h1>📊 Chat Volume Tracker</h1>
        <p>Genesys Chat Analytics Dashboard</p>
    </header>

    <section class="cards">

        <div class="card total">
            <h3>Total Chats</h3>
            <span id="totalChats">0</span>
        </div>

        <div class="card">
            <h3>CHGCXL</h3>
            <span id="chgcxl">0</span>
        </div>

        <div class="card">
            <h3>NEWBOOKING</h3>
            <span id="newbooking">0</span>
        </div>

        <div class="card">
            <h3>SCHEDULE CHANGE</h3>
            <span id="schedule">0</span>
        </div>

        <div class="card">
            <h3>IROP</h3>
            <span id="irop">0</span>
        </div>

    </section>

    <section class="chart-box">

        <div class="chart-header">
            <h2>Chats by Hour</h2>
        </div>

        <canvas id="hourChart"></canvas>

    </section>

    <script src="js/app.jsdy>

</html>
